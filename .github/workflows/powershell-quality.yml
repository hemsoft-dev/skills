name: Code Quality Check

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  powershell:
    name: PSScriptAnalyzer
    runs-on: windows-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      
      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser -ErrorAction Stop
          Write-Host "✓ PSScriptAnalyzer installed" -ForegroundColor Green
      
      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          
          Write-Host "🔍 Scanning for PowerShell files..." -ForegroundColor Cyan
          $files = Get-ChildItem -Recurse -Filter *.ps1 | Where-Object { 
            $_.FullName -notmatch '[\\/]\.git[\\/]' 
          }
          
          if (-not $files) {
            Write-Host "✓ No PowerShell files to analyze" -ForegroundColor Green
            exit 0
          }
          
          Write-Host "Found $($files.Count) PowerShell file(s)" -ForegroundColor Cyan
          
          $settingsPath = Join-Path $PWD '.PSScriptAnalyzerSettings.psd1'
          $hasIssues = $false
          $totalIssues = 0
          
          foreach ($file in $files) {
            Write-Host "`nAnalyzing: $($file.FullName -replace [regex]::Escape($PWD), '.')" -ForegroundColor Cyan
            
            $results = Invoke-ScriptAnalyzer -Path $file.FullName -Settings $settingsPath
            
            if ($results) {
              $hasIssues = $true
              $totalIssues += $results.Count
              
              Write-Host "  ❌ Found $($results.Count) issue(s):" -ForegroundColor Red
              
              foreach ($result in $results) {
                $color = if ($result.Severity -eq 'Error') { 'Red' } else { 'Yellow' }
                Write-Host "    Line $($result.Line): [$($result.Severity)] $($result.RuleName)" -ForegroundColor $color
                Write-Host "      $($result.Message)" -ForegroundColor Gray
              }
            } else {
              Write-Host "  ✓ No issues" -ForegroundColor Green
            }
          }
          
          if ($hasIssues) {
            Write-Host "`n❌ FAILED: Found $totalIssues issue(s) across $($files.Count) file(s)" -ForegroundColor Red
            Write-Host "`n⚠️  Fix the issues above before merging" -ForegroundColor Yellow
            Write-Host "See: .claude/skills/powershell/SKILL.md for guidance" -ForegroundColor Cyan
            exit 1
          }
          
          Write-Host "`n✓ All PowerShell files passed quality checks!" -ForegroundColor Green
          exit 0
      
      - name: Upload analysis results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: psscriptanalyzer-results
          path: |
            **/*.ps1
          retention-days: 30
  
  markdown:
    name: Markdownlint
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      
      - name: Install markdownlint-cli2
        run: |
          npm install -g markdownlint-cli2
          echo "✓ markdownlint-cli2 installed"
      
      - name: Run markdownlint
        run: |
          echo "🔍 Scanning for Markdown files..."
          
          # Find all markdown files excluding node_modules and .git
          FILES=$(find . -type f -name "*.md" ! -path "*/node_modules/*" ! -path "*/.git/*")
          
          if [ -z "$FILES" ]; then
            echo "✓ No Markdown files to analyze"
            exit 0
          fi
          
          echo "Found $(echo "$FILES" | wc -l) Markdown file(s)"
          
          # Run markdownlint
          if markdownlint-cli2 --config .markdownlint.jsonc "**/*.md" "#node_modules" "#.git"; then
            echo ""
            echo "✓ All Markdown files passed quality checks!"
            exit 0
          else
            echo ""
            echo "❌ FAILED: Markdown linting issues found"
            echo ""
            echo "⚠️  Fix the issues above before merging"
            echo "See: .claude/skills/markdown/SKILL.md for guidance"
            exit 1
          fi
      
      - name: Upload analysis results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: markdownlint-results
          path: |
            **/*.md
          retention-days: 30

