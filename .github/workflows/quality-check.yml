name: Quality Check

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  powershell:
    name: PowerShell Quality
    runs-on: windows-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      
      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser
          Write-Host "✓ PSScriptAnalyzer installed" -ForegroundColor Green
      
      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          $files = Get-ChildItem -Recurse -Filter *.ps1 | Where-Object { $_.FullName -notmatch '[\\/]\.git[\\/]' }
          if (-not $files) { Write-Host "✓ No PowerShell files"; exit 0 }
          
          $settingsPath = '.PSScriptAnalyzerSettings.psd1'
          $hasIssues = $false
          
          foreach ($file in $files) {
            $results = @(Invoke-ScriptAnalyzer -Path $file.FullName -Settings $settingsPath)
            if ($results.Count -gt 0) {
              $hasIssues = $true
              Write-Host "❌ $($file.Name): $($results.Count) issue(s)" -ForegroundColor Red
              $results | Format-Table Line, Severity, RuleName, Message
            }
          }
          
          if ($hasIssues) { exit 1 }
          Write-Host "✓ All PowerShell files passed" -ForegroundColor Green

      - name: Test repository cleanup with local Git remotes
        shell: pwsh
        run: |
          Install-Module -Name Pester -MinimumVersion 5.7.1 -Force -Scope CurrentUser
          Import-Module Pester -MinimumVersion 5.7.1 -Force
          Invoke-Pester -Path repo-cleanup/tests/RepoCleanup.Tests.ps1 -CI -Output Detailed

  markdown:
    name: Markdown Quality
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      
      - name: Install markdownlint-cli2
        run: npm install -g markdownlint-cli2
      
      - name: Run markdownlint
        run: |
          echo "📝 Scanning Markdown files..."
          markdownlint-cli2 "**/*.md" || exit 1
          echo "✓ All Markdown files passed quality checks"
